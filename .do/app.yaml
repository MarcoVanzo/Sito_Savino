databases:
- cluster_name: sito-savino-db
  engine: MYSQL
  name: sito-savino-db
  production: true
  version: "8"
ingress:
  rules:
  - component:
      name: web
    match:
      path:
        prefix: /
name: sito-savino
region: fra
services:
- build_command: composer install --optimize-autoloader --no-dev && npm install &&
    npm run build
  envs:
  - key: APP_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: APP_DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: APP_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_DOMAIN}
  - key: APP_KEY
