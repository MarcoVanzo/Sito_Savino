databases:
- cluster_name: sito-savino-db
  engine: MYSQL
  name: sito-savino-db
  production: true
  version: "8"
# Segreto dell'app Meta (`Savino Analytics`). Sta a livello di app, non dentro i
# singoli componenti: web, worker e scheduler ne hanno tutti bisogno (il web per
# il giro OAuth, gli altri per il sync notturno degli insight).
# Il valore è cifrato da DigitalOcean (EV[1:...]) e può stare in un repository
# pubblico: solo App Platform ha la chiave per decifrarlo. Per ruotarlo si
# rigenera il segreto su Meta, lo si riscrive dal pannello DO e si ricopia qui
# il nuovo valore cifrato — mai il segreto in chiaro.
envs:
- key: META_APP_SECRET
  scope: RUN_AND_BUILD_TIME
  type: SECRET
  value: EV[1:xuY5u2kyLv789WXxYgzt0++SIZJDacim:/faML89QUfH/adwTcFfKE0hH/GAzdseIoVigmSjA69C/irVc+F1NXu7C0Oy2BeAx]
ingress:
  rules:
  - component:
      name: web
    match:
      path:
        prefix: /
name: sito-savino
region: fra
services:
- build_command: composer install --optimize-autoloader --no-dev && npm ci --include=dev &&
    npm run build
  envs:
  - key: APP_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: APP_DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "false"
  # Lo schema va scritto per esteso: ${APP_DOMAIN} è il solo dominio, e Laravel
  # trattava il valore come path anteponendo "https://localhost" a ogni URL
  # generato da CLI (sitemap, email in coda, JSON-LD).
  - key: APP_URL
    scope: RUN_AND_BUILD_TIME
    value: https://${APP_DOMAIN}
  - key: APP_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:RUWZWKvJM8r0wVrFVOaICwXh5QlfgFFx:DfBDG/9Cwe6n071yJRZRL7V52SH21MaLsortBRZgqnztQEL9jkzdSCrNmmYl1qPiQYTRvacg3+5l2w61bo3ANT3TBw==]
  - key: PREVIEW_AUTH_USER
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:YKQFUJZOcCxZnTtcdfd33vqomoHS6Oy5:wCKDKq7bWRSQqgeEvK2WBA==]
  - key: PREVIEW_AUTH_PASS
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:7LvxDq1kWdmbFX23z8GUY/71b2QKI6FM:BN31jZmQ3Vqz90V4nmHdAg==]
  - key: DB_CONNECTION
    scope: RUN_AND_BUILD_TIME
    value: mysql
  - key: DB_HOST
    scope: RUN_AND_BUILD_TIME
    value: ${sito-savino-db.HOSTNAME}
  - key: DB_PORT
    scope: RUN_AND_BUILD_TIME
    value: ${sito-savino-db.PORT}
  - key: DB_DATABASE
    scope: RUN_AND_BUILD_TIME
    value: ${sito-savino-db.DATABASE}
  - key: DB_USERNAME
    scope: RUN_AND_BUILD_TIME
    value: ${sito-savino-db.USERNAME}
  - key: DB_PASSWORD
    scope: RUN_AND_BUILD_TIME
    value: ${sito-savino-db.PASSWORD}
  - key: FILESYSTEM_DISK
    scope: RUN_AND_BUILD_TIME
    value: s3
  - key: MEDIA_DISK
    scope: RUN_AND_BUILD_TIME
    value: s3
  # Il pannello NON segue FILESYSTEM_DISK: il valore di serie di Filament e'
  # il disco locale del container, che qui viene ricreato a ogni rilascio.
  # Senza questa riga i PDF caricati dalla redazione sparivano lasciando in
  # archivio un percorso che non porta a nessun file. Il ripiego e' anche in
  # config/filament.php: qui e' scritto perche' si veda.
  - key: FILAMENT_FILESYSTEM_DISK
    scope: RUN_AND_BUILD_TIME
    value: s3
  - key: AWS_ACCESS_KEY_ID
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:+LFmd8w1N5i7v03BKfR//HJqX54tCzFc:4aNByITR0XIXor3kJku8Bcfb3iYSwKVmVpLbKDZ8toCliKFL]
  - key: AWS_SECRET_ACCESS_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:7Er1oZyvefY3H27uNgwD5/snxLZ6YlgW:Qoe/6QtoZUuDwMVzP1YCb9doDlrlZNEAfa9pY/WzmjIQHf7s7vU4K2ikfBXx1RkNHI8aJd7gIrLvFKs=]
  - key: AWS_DEFAULT_REGION
    scope: RUN_AND_BUILD_TIME
    value: fra1
  - key: AWS_BUCKET
    scope: RUN_AND_BUILD_TIME
    value: sito-savino-assets-2026
  - key: AWS_ENDPOINT
    scope: RUN_AND_BUILD_TIME
    value: https://fra1.digitaloceanspaces.com
  - key: AWS_URL
    scope: RUN_AND_BUILD_TIME
    value: https://sito-savino-assets-2026.fra1.digitaloceanspaces.com
  - key: LOG_CHANNEL
    scope: RUN_AND_BUILD_TIME
    value: stderr
  # `error` e non `warning`: i log di App Platform sono effimeri e nessuno li
  # guarda, quindi servono solo come contesto di un errore già segnalato da
  # Sentry. Allineato al worker, che prima era su `info` senza motivo.
  - key: LOG_LEVEL
    scope: RUN_AND_BUILD_TIME
    value: error
  # Sentry. Il valore va sostituito con il DSN reale CIFRATO (formato EV[1:...],
  # come APP_KEY qui sopra): questa spec è la sorgente autorevole — l'action di
  # deploy la applica alla app — quindi un valore impostato solo dal pannello
  # verrebbe sovrascritto al rilascio successivo.
  #
  # Si genera impostando il DSN dal pannello DO e riscaricando la spec, oppure
  # con `doctl apps update <app-id> --spec .do/app.yaml`.
  #
  # Finché resta vuoto, Sentry è semplicemente spento: SentryDsn::sanitize()
  # scarta i valori non interpretabili invece di lasciarli arrivare al SDK, che
  # li rifiuterebbe dentro boot() impedendo l'avvio dell'applicazione.
  - key: SENTRY_LARAVEL_DSN
    scope: RUN_AND_BUILD_TIME
    value: ""
  - key: SENTRY_ENVIRONMENT
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: SENTRY_TRACES_SAMPLE_RATE
    scope: RUN_AND_BUILD_TIME
    value: "0.1"
  - key: SESSION_DRIVER
    scope: RUN_AND_BUILD_TIME
    value: database
  # Il pannello si usa per ore di fila: compilando una pagina lunga — la
  # scheda Safeguarding con i PDF, il listino abbonamenti — con i due
  # canonici si superavano i 120 minuti di default e il salvataggio tornava
  # "questa pagina e' scaduta" (419), buttando via tutto il lavoro. Otto ore
  # coprono una giornata di redazione.
  - key: SESSION_LIFETIME
    scope: RUN_AND_BUILD_TIME
    value: "480"
  - key: SESSION_ENCRYPT
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: CACHE_STORE
    scope: RUN_AND_BUILD_TIME
    value: database
  - key: QUEUE_CONNECTION
    scope: RUN_AND_BUILD_TIME
    value: database
  - key: SESSION_SECURE_COOKIE
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: APP_LOCALE
    scope: RUN_AND_BUILD_TIME
    value: it
  - key: INERTIA_SSR_ENABLED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: COMPREFACE_HOST
    scope: RUN_AND_BUILD_TIME
    value: http://10.114.0.3:8000
  - key: COMPREFACE_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:PDLgtGt+aK43RpEn8cr9ld9kIREtKpNF:NRlgEbkP29S4vWwUVl2bDEVeyUHGTjJyrHktq3V6C3N6Gx1uvEIh4PaxArgn3iMeMubzqQ==]
  - key: ACTIVECAMPAIGN_URL
    scope: RUN_AND_BUILD_TIME
    value: https://savinodelbenevolley.api-us1.com
  # ⚠️  ATTENZIONE: questa API key va RUOTATA e CIFRATA con doctl.
  # Eseguire: doctl apps update <app-id> dopo aver cifrato il nuovo valore.
  - key: ACTIVECAMPAIGN_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: 6caf9e1800fc6da3fdbf3bd991880e8528093a488ebc5acd29d7b3681201d0d1f4732524
  - key: ACTIVECAMPAIGN_LIST_ID
    scope: RUN_AND_BUILD_TIME
    value: "2"
  # Service account Google per la GA4 Data API, in JSON codificato base64.
  # Il valore è cifrato da DigitalOcean (EV[1:...]): può stare in un repository
  # pubblico perché solo App Platform ha la chiave per decifrarlo. Non sostituirlo
  # mai con il JSON in chiaro, e non rigenerarlo a mano: per cambiarlo si applica
  # la spec con il valore nuovo e si ricopia qui quello cifrato che DO restituisce.
  - key: GA4_SERVICE_ACCOUNT_JSON
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:WjQnMqCrzibqvgOkk+pJ2u16fjn696tC:]
  # App Meta usata per collegare Pagina Facebook e profilo Instagram
  # (portfolio business "Savino Del Bene Volley", che possiede entrambi).
  # ID app e ID configurazione NON sono segreti: viaggiano in chiaro
  # nell'URL della schermata di consenso. Il segreto è META_APP_SECRET.
  - key: META_APP_ID
    scope: RUN_AND_BUILD_TIME
    value: "1098244582719500"
  # Configurazione di Facebook Login for Business "Sito Savino Insights":
  # include read_insights, senza cui le metriche della Pagina arrivano vuote
  # e Meta non segnala alcun errore.
  - key: META_CONFIG_ID
    scope: RUN_AND_BUILD_TIME
    value: "1530681078385238"
  github:
    branch: main
    # Deploy gestito dal job "deploy" gated in .github/workflows/ci.yml
    # (solo dopo che i test passano). Evita il doppio deploy e i rilasci
    # non gated che avvenivano con deploy_on_push: true.
    deploy_on_push: false
    repo: MarcoVanzo/sito_savino
  # Senza questo blocco App Platform si limita al controllo TCP sulla porta:
  # Apache vivo significava container sano, anche con il database
  # irraggiungibile. `/up` esegue le verifiche vere (vedi
  # App\Listeners\VerifyApplicationHealth).
  #
  # Fallisce SOLO su ciò che un riavvio di questo container può risolvere:
  # database e cache. Un pianificatore fermo viene segnalato ma non fa fallire
  # il controllo — ha un componente suo, riavviare il web non lo resuscita, e
  # far fallire qui metterebbe il sito in ciclo di riavvio per un guasto che
  # senza health check sarebbe stato soltanto silenzioso.
  health_check:
    http_path: /up
    # NON abbassare sotto i 60 secondi. start.sh esegue `cache:clear`, e la cache
    # è lo store condiviso dove vive il battito del pianificatore: a ogni avvio
    # del container web il battito viene cancellato e torna solo al giro
    # successivo dello scheduler, cioè entro un minuto. Con un ritardo iniziale
    # più corto, ogni riavvio del web si auto-diagnosticherebbe come "scheduler
    # morto" e l'istanza entrerebbe in ciclo di riavvio. 120s lascia margine
    # anche alle migrazioni, che allungano il boot.
    initial_delay_seconds: 120
    period_seconds: 30
    timeout_seconds: 5
    # Tre fallimenti di fila (90s) prima del riavvio: una singola lentezza del
    # database non deve far cadere l'istanza.
    failure_threshold: 3
    success_threshold: 1
  http_port: 8080
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  name: web
  run_command: bash start.sh
