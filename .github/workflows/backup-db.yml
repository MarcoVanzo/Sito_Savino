# =============================================================================
# Backup Database — Sito Savino
# Esegue mysqldump giornaliero, cifra con GPG AES-256, carica su DO Spaces
# =============================================================================

name: Backup Database

on:
  schedule:
    # Ogni giorno alle 03:00 UTC (05:00 ora italiana)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del backup manuale'
        required: false
        default: 'Backup manuale'



# Impedisce esecuzioni concorrenti (fix #10)
concurrency:
  group: backup-db
  cancel-in-progress: false

env:
  BUCKET_NAME: sito-savino-backups
  SPACES_REGION: fra1
  SPACES_ENDPOINT: https://fra1.digitaloceanspaces.com

jobs:
  backup:
    name: Dump, Encrypt & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write

    # Esposti a livello di job perché il campo `if:` di uno step non vede il
    # context `secrets` (stesso motivo per cui `ci.yml` espone così SONAR_TOKEN).
    # Finché non sono impostati, la copia su R2 viene saltata e il backup su
    # Spaces continua a funzionare come prima.
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      # ---------------------------------------------------------------
      # 1. Installazione dipendenze
      # ---------------------------------------------------------------
      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client gpg

      # ---------------------------------------------------------------
      # 2. Variabili di naming
      # ---------------------------------------------------------------
      - name: Genera naming backup
        id: naming
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")
          FILENAME="backup-${TIMESTAMP}.sql.gz.gpg"
          S3_PATH="db/${YEAR}/${MONTH}/${FILENAME}"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "s3_path=${S3_PATH}" >> "$GITHUB_OUTPUT"
          echo "📦 Backup file: ${FILENAME}"
          echo "📁 Destinazione: s3://${BUCKET_NAME}/${S3_PATH}"

      # ---------------------------------------------------------------
      # 2b. Autentica doctl (per gestire il firewall del DB)
      #     Token dedicato least-privilege (scope: database read+update),
      #     distinto dal DIGITALOCEAN_ACCESS_TOKEN usato per il deploy.
      # ---------------------------------------------------------------
      - name: Autentica doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.BACKUP_DO_DB_TOKEN }}

      # ---------------------------------------------------------------
      # 2c. Whitelist temporaneo dell'IP del runner nelle Trusted Sources
      #     Il cluster è chiuso al mondo (hardening): apriamo solo l'IP
      #     effimero di questo run, che verrà rimosso a fine job (step 9).
      # ---------------------------------------------------------------
      - name: Whitelist IP runner nel firewall del DB
        run: |
          set -eo pipefail

          RUNNER_IP=$(curl -sf --retry 3 --retry-delay 2 https://checkip.amazonaws.com | tr -d '[:space:]')
          if [ -z "$RUNNER_IP" ]; then
            echo "❌ Impossibile determinare l'IP pubblico del runner"; exit 1
          fi
          echo "🌐 IP runner: ${RUNNER_IP}"

          CLUSTER_ID=$(doctl databases list --format ID,Name --no-header \
            | awk -v n="sito-savino-db" '$2==n {print $1}')
          if [ -z "$CLUSTER_ID" ]; then
            echo "❌ Cluster DB 'sito-savino-db' non trovato"; exit 1
          fi

          # Salva per lo step di cleanup (step 9)
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          echo "CLUSTER_ID=${CLUSTER_ID}" >> "$GITHUB_ENV"

          echo "🔓 Aggiungo ${RUNNER_IP} alle Trusted Sources del cluster..."
          doctl databases firewalls append "$CLUSTER_ID" --rule "ip_addr:${RUNNER_IP}"

          # Attesa propagazione della regola prima di connettersi
          sleep 20
          echo "✅ IP whitelisted."

      # ---------------------------------------------------------------
      # 3. Dump MySQL → Compress → Encrypt
      #    Fix #1: usa set -o pipefail per catturare errori di mysqldump
      #    Fix #3: usa --passphrase-fd per evitare leak della passphrase
      # ---------------------------------------------------------------
      - name: Dump database, comprimi e cifra
        env:
          DB_HOST: ${{ secrets.BACKUP_DB_HOST }}
          DB_PORT: ${{ secrets.BACKUP_DB_PORT }}
          DB_USER: ${{ secrets.BACKUP_DB_USER }}
          DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          DB_NAME: ${{ secrets.BACKUP_DB_NAME }}
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -eo pipefail

          echo "🔄 Avvio mysqldump..."

          mysqldump \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USER" \
            --password="$DB_PASSWORD" \
            --single-transaction \
            --routines \
            --triggers \
            --events \
            --set-gtid-purged=OFF \
            "$DB_NAME" \
          | gzip -9 \
          | gpg --symmetric \
                --batch \
                --yes \
                --passphrase-fd 3 \
                --cipher-algo AES256 \
                --compress-algo none \
                --output "${{ steps.naming.outputs.filename }}" \
            3<<< "$GPG_PASSPHRASE"

          # Verifica che il file esista e abbia una dimensione ragionevole
          FILE_SIZE=$(stat --format="%s" "${{ steps.naming.outputs.filename }}")
          if [ "$FILE_SIZE" -lt 500 ]; then
            echo "❌ Errore: file di backup troppo piccolo (${FILE_SIZE} bytes) — probabile dump vuoto"
            exit 1
          fi

          echo "✅ Dump completato: ${FILE_SIZE} bytes"
          echo "file_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 4. Genera checksum SHA-256
      # ---------------------------------------------------------------
      - name: Genera checksum SHA-256
        run: |
          sha256sum "${{ steps.naming.outputs.filename }}" > "${{ steps.naming.outputs.filename }}.sha256"
          echo "🔐 Checksum SHA-256:"
          cat "${{ steps.naming.outputs.filename }}.sha256"

      # ---------------------------------------------------------------
      # 5. Upload su DO Spaces
      #    Fix #2: usa env vars invece di aws configure (no file su disco)
      # ---------------------------------------------------------------
      - name: Upload backup su DO Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_BACKUP_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_BACKUP_SPACES_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.SPACES_REGION }}
        run: |
          echo "📤 Upload backup..."
          aws s3 cp \
            "${{ steps.naming.outputs.filename }}" \
            "s3://${{ env.BUCKET_NAME }}/${{ steps.naming.outputs.s3_path }}" \
            --endpoint-url "${{ env.SPACES_ENDPOINT }}"

          echo "📤 Upload checksum..."
          aws s3 cp \
            "${{ steps.naming.outputs.filename }}.sha256" \
            "s3://${{ env.BUCKET_NAME }}/${{ steps.naming.outputs.s3_path }}.sha256" \
            --endpoint-url "${{ env.SPACES_ENDPOINT }}"

          echo "✅ Upload completato."

      # ---------------------------------------------------------------
      # 6. Verifica upload (fix #6: verifica in un singolo step robusto)
      # ---------------------------------------------------------------
      - name: Verifica presenza file su Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_BACKUP_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_BACKUP_SPACES_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.SPACES_REGION }}
        run: |
          echo "🔍 Verifica file caricato..."
          REMOTE_SIZE=$(aws s3api head-object \
            --bucket "${{ env.BUCKET_NAME }}" \
            --key "${{ steps.naming.outputs.s3_path }}" \
            --endpoint-url "${{ env.SPACES_ENDPOINT }}" \
            --query 'ContentLength' --output text)

          if [ -z "$REMOTE_SIZE" ] || [ "$REMOTE_SIZE" -lt 500 ]; then
            echo "❌ File non trovato o troppo piccolo su DO Spaces! (size: ${REMOTE_SIZE:-0})"
            exit 1
          fi

          echo "✅ Backup verificato su DO Spaces (${REMOTE_SIZE} bytes)."

      # ---------------------------------------------------------------
      # 6-bis. Copia fuori da DigitalOcean, su un bucket che non si riscrive
      #
      # Su Spaces la protezione è una bucket policy che vieta le cancellazioni:
      # tiene contro l'errore e contro chi ha una chiave qualunque, ma non
      # contro chi ha una chiave con permessi di gestione — può riscrivere la
      # policy, e comunque `PutObject` resta permesso, quindi un backup si può
      # sovrascrivere con spazzatura. DO Spaces non offre niente di meglio: né
      # Object Lock né versioning.
      #
      # Su R2 il bucket porta una *bucket lock rule* che impedisce cancellazione
      # e sovrascrittura per la durata della retention, indipendentemente dalle
      # credenziali usate. Le chiavi vivono su Cloudflare: chi compromette
      # l'account DigitalOcean non le ha, e viceversa.
      # ---------------------------------------------------------------
      - name: Copia immutabile su Cloudflare R2
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli v2 aggiunge di suo dei checksum che R2 rifiuta su alcune
          # richieste: si calcolano solo dove il protocollo li richiede.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -eo pipefail

          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3api put-object \
            --bucket "${R2_BUCKET}" \
            --key "${{ steps.naming.outputs.s3_path }}" \
            --body "${{ steps.naming.outputs.filename }}" \
            --endpoint-url "$R2_ENDPOINT" > /dev/null

          aws s3api put-object \
            --bucket "${R2_BUCKET}" \
            --key "${{ steps.naming.outputs.s3_path }}.sha256" \
            --body "${{ steps.naming.outputs.filename }}.sha256" \
            --endpoint-url "$R2_ENDPOINT" > /dev/null

          # Una copia che nessuno ha riletto non è una copia.
          R2_SIZE=$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${{ steps.naming.outputs.s3_path }}" \
            --endpoint-url "$R2_ENDPOINT" \
            --query 'ContentLength' --output text)

          if [ -z "$R2_SIZE" ] || [ "$R2_SIZE" -lt 500 ]; then
            echo "❌ Copia su R2 assente o troncata (size: ${R2_SIZE:-0})"
            exit 1
          fi

          echo "🔒 Copia immutabile su R2 verificata (${R2_SIZE} bytes)."

      - name: Avviso se la copia fuori sede non è configurata
        if: env.R2_ACCOUNT_ID == '' || env.R2_BUCKET == ''
        run: |
          echo "⚠️ Nessuna copia fuori da DigitalOcean: i segreti R2_* non sono impostati."
          echo "   Il backup esiste in una sola copia, su un bucket dove un attaccante"
          echo "   con i permessi giusti può sovrascriverlo. Vedi BACKUP.md."

      # ---------------------------------------------------------------
      # 7. Cleanup
      # ---------------------------------------------------------------
      - name: Cleanup file locali
        if: always()
        run: |
          rm -f ./*.sql.gz.gpg ./*.sha256
          echo "🧹 File locali rimossi."

      # ---------------------------------------------------------------
      # 9. Rimozione IP runner dal firewall del DB (sempre, anche su errore)
      #    Ripristina il lockdown del cluster rimuovendo la regola effimera.
      # ---------------------------------------------------------------
      - name: Rimuovi IP runner dal firewall del DB
        if: always()
        run: |
          set -eo pipefail
          if [ -z "${CLUSTER_ID}" ] || [ -z "${RUNNER_IP}" ]; then
            echo "ℹ️ Nessun IP da rimuovere (whitelist non eseguita)."
            exit 0
          fi

          # NB: `doctl databases firewalls list` NON supporta --format:
          # usare l'output JSON e filtrare con jq.
          RULE_UUID=$(doctl databases firewalls list "$CLUSTER_ID" -o json \
            | jq -r --arg ip "${RUNNER_IP}" \
                '.[] | select(.type=="ip_addr" and .value==$ip) | .uuid')

          if [ -z "$RULE_UUID" ]; then
            echo "⚠️ Regola per ${RUNNER_IP} non trovata (già rimossa?)."
            exit 0
          fi

          # La rimozione richiede l'UUID via flag --uuid (non posizionale).
          # Niente masking dell'errore: se fallisce, lo step deve fallire —
          # un IP rimasto whitelistato è un rischio da far emergere.
          doctl databases firewalls remove "$CLUSTER_ID" --uuid "$RULE_UUID"
          echo "🔒 IP ${RUNNER_IP} rimosso dalle Trusted Sources."

      # ---------------------------------------------------------------
      # 8. Riepilogo
      # ---------------------------------------------------------------
      - name: Riepilogo backup
        if: success()
        run: |
          echo "============================================="
          echo "  ✅ BACKUP DATABASE COMPLETATO"
          echo "============================================="
          echo "  Timestamp: ${{ steps.naming.outputs.timestamp }}"
          echo "  File:      ${{ steps.naming.outputs.filename }}"
          echo "  Path S3:   s3://${{ env.BUCKET_NAME }}/${{ steps.naming.outputs.s3_path }}"
          echo "  Cifratura: GPG AES-256"
          echo "  Trigger:   ${{ github.event_name }}"
          echo "============================================="

  # -----------------------------------------------------------------
  # Job di notifica in caso di fallimento
  # -----------------------------------------------------------------
  notify-failure:
    name: Notifica fallimento
    runs-on: ubuntu-latest
    needs: backup
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Crea issue di notifica
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Backup DB fallito — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Backup Database Fallito',
              '',
              `**Data:** ${new Date().toISOString()}`,
              `**Workflow:** ${context.workflow}`,
              `**Run ID:** ${context.runId}`,
              `**Trigger:** ${context.eventName}`,
              '',
              `🔗 [Vedi logs del workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Azione richiesta',
              'Verificare i logs del workflow e risolvere il problema.',
              'Eseguire un backup manuale dopo la correzione.'
            ].join('\n');

            // Fix #8: crea le labels se non esistono
            for (const label of ['backup', 'urgente']) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'urgente' ? 'D93F0B' : '0E8A16'
                });
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['backup', 'urgente']
            });
