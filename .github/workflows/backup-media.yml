# =============================================================================
# Backup Media — Sito Savino
# Sincronizza i file media da DO Spaces produzione a DO Spaces backup
# =============================================================================

name: Backup Media

on:
  schedule:
    # Ogni domenica alle 04:00 UTC (06:00 ora italiana)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del backup manuale'
        required: false
        default: 'Backup media manuale'



# Impedisce esecuzioni concorrenti (fix #10)
concurrency:
  group: backup-media
  cancel-in-progress: false

env:
  # Sorgente (produzione)
  PROD_BUCKET: sito-savino-assets-2026
  PROD_ENDPOINT: https://fra1.digitaloceanspaces.com

  # Destinazione (backup)
  BACKUP_BUCKET: sito-savino-backups
  BACKUP_REGION: fra1
  BACKUP_ENDPOINT: https://fra1.digitaloceanspaces.com

jobs:
  backup-media:
    name: Sync Media Files
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      issues: write

    steps:
      # ---------------------------------------------------------------
      # 1. Installazione rclone
      # ---------------------------------------------------------------
      - name: Installa rclone
        # Installazione dai repository APT firmati di Ubuntu invece di
        # `curl … | sudo bash` (SonarCloud S8482/S6506): niente esecuzione di
        # artefatti scaricati non verificati e nessun rischio di redirect.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version

      # ---------------------------------------------------------------
      # 2. Configurazione rclone
      #    Fix #4: nessuna indentazione nel heredoc (rclone è sensibile)
      # ---------------------------------------------------------------
      - name: Configura rclone remotes
        env:
          DO_PROD_KEY: ${{ secrets.DO_PROD_SPACES_KEY }}
          DO_PROD_SECRET: ${{ secrets.DO_PROD_SPACES_SECRET }}
          DO_BK_KEY: ${{ secrets.DO_BACKUP_SPACES_KEY }}
          DO_BK_SECRET: ${{ secrets.DO_BACKUP_SPACES_SECRET }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [do-prod]
          type = s3
          provider = DigitalOcean
          access_key_id = ${DO_PROD_KEY}
          secret_access_key = ${DO_PROD_SECRET}
          endpoint = ${PROD_ENDPOINT}
          acl = private

          [do-backup]
          type = s3
          provider = DigitalOcean
          access_key_id = ${DO_BK_KEY}
          secret_access_key = ${DO_BK_SECRET}
          endpoint = ${BACKUP_ENDPOINT}
          acl = private
          EOF

          # Fix #4: rimuovi indentazione residua da YAML
          sed -i 's/^          //' ~/.config/rclone/rclone.conf

          # Verifica che i remote funzionino
          rclone lsd "do-prod:${PROD_BUCKET}" > /dev/null 2>&1 && echo "✅ Remote do-prod OK" || { echo "❌ Remote do-prod fallito"; exit 1; }
          rclone lsd do-backup: > /dev/null 2>&1 && echo "✅ Remote do-backup OK" || { echo "❌ Remote do-backup fallito"; exit 1; }

      # ---------------------------------------------------------------
      # 3. Conta file sorgente (pre-sync)
      # ---------------------------------------------------------------
      - name: Conta file sorgente
        id: pre_sync
        run: |
          echo "📊 Conteggio file nel bucket di produzione..."
          PROD_COUNT=$(rclone lsf "do-prod:${PROD_BUCKET}" --recursive 2>/dev/null | wc -l)
          PROD_SIZE=$(rclone size "do-prod:${PROD_BUCKET}" --json 2>/dev/null | jq -r '.bytes // 0')
          echo "prod_count=${PROD_COUNT}" >> "$GITHUB_OUTPUT"
          echo "prod_size=${PROD_SIZE}" >> "$GITHUB_OUTPUT"
          echo "📁 File in produzione: ${PROD_COUNT} ($(numfmt --to=iec ${PROD_SIZE}))"

          # Se il bucket è vuoto, salta la sincronizzazione
          if [ "${PROD_COUNT}" -eq 0 ]; then
            echo "⚠️ Bucket di produzione vuoto — nessun file da copiare."
            echo "skip_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sync=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------
      # 4. Sync con rclone copy
      #    Fix #7: aggiunto --checksum per verifica integrità
      # ---------------------------------------------------------------
      - name: Copia media su bucket di backup
        if: steps.pre_sync.outputs.skip_sync != 'true'
        run: |
          echo "🔄 Avvio copia incrementale media..."

          if ! rclone copy \
            "do-prod:${PROD_BUCKET}/" \
            "do-backup:${BACKUP_BUCKET}/media/" \
            --checksum \
            --transfers 8 \
            --checkers 16 \
            --s3-chunk-size 64M \
            --stats 30s \
            --stats-one-line \
            --log-level INFO \
            --log-file rclone-sync.log; then
            echo "❌ Errore durante la sincronizzazione con rclone!"
            if [ -f rclone-sync.log ]; then
              echo "📝 --- CONTENUTO LOG RCLONE ---"
              cat rclone-sync.log
              echo "📝 --- FINE LOG RCLONE ---"
            fi
            exit 1
          fi

          echo "✅ Copia completata."

      # ---------------------------------------------------------------
      # 5. Genera manifest
      # ---------------------------------------------------------------
      # Il manifest si costruisce elencando il bucket SORGENTE, non quello di
      # backup. Sono gli stessi file — la copia dello step precedente esce con
      # errore se non li ha trasferiti tutti — ma i due bucket non si elencano
      # affatto allo stesso modo: il 18/09/2026, con 81.308 oggetti per 11 GB,
      # la listata del sorgente ha impiegato 25 secondi e quella del bucket di
      # backup non è finita in 20 minuti, nemmeno con `--fast-list`.
      #
      # È la stessa lentezza che dal 23/08 al 13/09 ha ucciso quattro backup di
      # fila al tetto delle due ore: il passo restava appeso mentre i file, in
      # realtà, erano già stati copiati.
      #
      # Niente `--fast-list`: era lui la causa, non il bucket. La prova del
      # 18/09/2026, sugli stessi 81.308 oggetti: `rclone lsf --recursive` senza
      # quell'opzione (il passo "Conta file sorgente") impiega 25 secondi,
      # `rclone lsl --fast-list` non finisce in 20 minuti e lascia un manifest
      # troncato a un decimo delle righe. `--fast-list` tiene l'intero elenco
      # in memoria prima di emetterlo, e su un bucket di questa taglia non
      # conviene.
      #
      # Restano il tetto di tempo e `continue-on-error` come rete: se anche
      # questa listata si impantana, il backup resta valido e il riepilogo
      # dichiara che manca l'indice.
      - name: Genera manifest post-sync
        id: manifest
        if: steps.pre_sync.outputs.skip_sync != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H%M%SZ")
          MANIFEST_FILE="manifest-${TIMESTAMP}.txt"

          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "manifest_file=${MANIFEST_FILE}" >> "$GITHUB_OUTPUT"

          echo "📋 Generazione manifest..."
          {
            echo "# Media Backup Manifest"
            echo "# Generated: ${TIMESTAMP}"
            echo "# Source: do-prod:${PROD_BUCKET}"
            echo "# Destination: do-backup:${BACKUP_BUCKET}/media/"
            echo "# L'elenco è quello dei file di produzione al momento della copia:"
            echo "# la copia è terminata senza errori, quindi il backup li contiene tutti."
            echo "---"
          } > "$MANIFEST_FILE"

          if rclone lsl "do-prod:${PROD_BUCKET}" \
            --retries 2 \
            --low-level-retries 3 \
            >> "$MANIFEST_FILE" 2>/dev/null; then
            # Le righe dell'intestazione non sono file.
            BACKUP_COUNT=$(($(wc -l < "$MANIFEST_FILE") - 7))
            echo "manifest_ok=true" >> "$GITHUB_OUTPUT"
            echo "📁 File nel manifest: ${BACKUP_COUNT}"
          else
            BACKUP_COUNT=0
            echo "manifest_ok=false" >> "$GITHUB_OUTPUT"
            echo "# ELENCO NON RIUSCITO — i file sono copiati, manca il loro indice." >> "$MANIFEST_FILE"
            echo "⚠️ Elenco non riuscito: i file sono copiati, manca il manifest."
          fi

          echo "backup_count=${BACKUP_COUNT}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 6. Upload manifest e log (fix #2: usa env vars)
      # ---------------------------------------------------------------
      - name: Upload manifest e log
        if: steps.pre_sync.outputs.skip_sync != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_BACKUP_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_BACKUP_SPACES_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.BACKUP_REGION }}
        run: |
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")

          aws s3 cp \
            "${{ steps.manifest.outputs.manifest_file }}" \
            "s3://${BACKUP_BUCKET}/media/_manifests/${YEAR}/${MONTH}/${{ steps.manifest.outputs.manifest_file }}" \
            --endpoint-url "${BACKUP_ENDPOINT}"

          aws s3 cp \
            rclone-sync.log \
            "s3://${BACKUP_BUCKET}/media/_logs/${YEAR}/${MONTH}/sync-${{ steps.manifest.outputs.timestamp }}.log" \
            --endpoint-url "${BACKUP_ENDPOINT}"

          echo "✅ Manifest e log caricati."

      # ---------------------------------------------------------------
      # 7. Cleanup
      # ---------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -f manifest-*.txt rclone-sync.log
          rm -f ~/.config/rclone/rclone.conf
          echo "🧹 Cleanup completato."

      # ---------------------------------------------------------------
      # 8. Riepilogo
      # ---------------------------------------------------------------
      - name: Riepilogo
        if: success() && steps.pre_sync.outputs.skip_sync != 'true'
        run: |
          echo "============================================="
          echo "  ✅ BACKUP MEDIA COMPLETATO"
          echo "============================================="
          echo "  Timestamp:       ${{ steps.manifest.outputs.timestamp }}"
          echo "  File produzione: ${{ steps.pre_sync.outputs.prod_count }}"
          echo "  File backup:     ${{ steps.manifest.outputs.backup_count }}"
          if [ "${{ steps.manifest.outputs.manifest_ok }}" != "true" ]; then
            echo "  Manifest:        ⚠️ non generato (file copiati, indice mancante)"
          fi
          echo "  Modalità:        Copia incrementale con checksum (no delete)"
          echo "  Trigger:         ${{ github.event_name }}"
          echo "============================================="

      - name: Riepilogo (bucket vuoto)
        if: success() && steps.pre_sync.outputs.skip_sync == 'true'
        run: |
          echo "============================================="
          echo "  ⚠️ BACKUP MEDIA SALTATO"
          echo "============================================="
          echo "  Il bucket di produzione è vuoto."
          echo "  Nessun file da sincronizzare."
          echo "  Trigger:         ${{ github.event_name }}"
          echo "============================================="

  # -----------------------------------------------------------------
  # Copia fuori da DigitalOcean, su un bucket che non si riscrive
  #
  # Su Spaces la protezione è una bucket policy che vieta le cancellazioni: non
  # tiene contro chi ha una chiave con permessi di gestione, perché quella
  # policy la può riscrivere, e comunque `PutObject` resta permesso — le foto
  # si possono sovrascrivere con spazzatura. Su R2 la regola `retention-media`
  # impedisce cancellazione e sovrascrittura per 30 giorni, chiunque sia a
  # chiedere, e le credenziali vivono su Cloudflare: chi compromette
  # DigitalOcean non le ha.
  #
  # Si copia dalla produzione, non dal bucket di backup: è la stessa sorgente e
  # si elenca in 25 secondi invece di non finire mai (vedi il passo del
  # manifest).
  # -----------------------------------------------------------------
  offsite:
    name: Copia immutabile su Cloudflare R2
    runs-on: ubuntu-latest
    needs: backup-media
    if: needs.backup-media.result == 'success'
    timeout-minutes: 180
    permissions:
      issues: write

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Il confronto si valuta qui e ne esce un booleano: le chiavi non
      # compaiono da nessuna parte, ma il job sa se ci sono.
      R2_CHIAVI_PRESENTI: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}

    steps:
      - name: Installa rclone
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != '' && env.R2_CHIAVI_PRESENTI == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -1

      - name: Configura rclone
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != '' && env.R2_CHIAVI_PRESENTI == 'true'
        env:
          DO_PROD_KEY: ${{ secrets.DO_PROD_SPACES_KEY }}
          DO_PROD_SECRET: ${{ secrets.DO_PROD_SPACES_SECRET }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [do-prod]
          type = s3
          provider = DigitalOcean
          access_key_id = ${DO_PROD_KEY}
          secret_access_key = ${DO_PROD_SECRET}
          endpoint = ${PROD_ENDPOINT}
          acl = private

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_KEY}
          secret_access_key = ${R2_SECRET}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          region = auto
          acl = private
          EOF

          sed -i 's/^          //' ~/.config/rclone/rclone.conf

          rclone lsd "do-prod:${PROD_BUCKET}" > /dev/null 2>&1 && echo "✅ Remote do-prod OK" || { echo "❌ Remote do-prod fallito"; exit 1; }
          rclone lsd "r2:${R2_BUCKET}" > /dev/null 2>&1 && echo "✅ Remote r2 OK" || { echo "❌ Remote r2 fallito"; exit 1; }

      # `--ignore-existing` non è un'ottimizzazione: con la regola di lock
      # attiva, riscrivere un file già copiato viene RIFIUTATO, e senza questa
      # opzione rclone ci proverebbe a ogni giro facendo fallire il job.
      # I file dei media non cambiano contenuto a parità di nome: quando una
      # foto viene sostituita, medialibrary le dà un percorso nuovo.
      - name: Copia i media su R2
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != '' && env.R2_CHIAVI_PRESENTI == 'true'
        id: copia
        run: |
          set -eo pipefail

          echo "🔄 Copia verso R2 (solo i file che non ci sono ancora)..."

          rclone copy "do-prod:${PROD_BUCKET}/" "r2:${R2_BUCKET}/media/" \
            --ignore-existing \
            --transfers 16 \
            --checkers 32 \
            --s3-chunk-size 64M \
            --stats 60s \
            --stats-one-line \
            --log-level INFO \
            --log-file rclone-r2.log

          # Le statistiche stanno nel log di rclone, non sullo standard output:
          # il primo giro costa 11 GB, i successivi solo le foto nuove.
          echo "📦 Ultime righe del log di rclone:"
          tail -3 rclone-r2.log || true
          echo "✅ Copia su R2 completata."

      - name: Avviso se la copia fuori sede non è configurata
        if: env.R2_ACCOUNT_ID == '' || env.R2_BUCKET == '' || env.R2_CHIAVI_PRESENTI != 'true'
        run: |
          echo "⚠️ Nessuna copia dei media fuori da DigitalOcean: i segreti R2_* non sono impostati."
          echo "   Le foto esistono in una sola copia, su un bucket dove un attaccante con i"
          echo "   permessi giusti può sovrascriverle. Vedi BACKUP.md."

      - name: Cleanup
        if: always()
        run: rm -f rclone-r2.log ~/.config/rclone/rclone.conf

  # -----------------------------------------------------------------
  # Notifica fallimento
  # -----------------------------------------------------------------
  notify-failure:
    name: Notifica fallimento
    runs-on: ubuntu-latest
    needs: [backup-media, offsite]
    # Anche `cancelled()`: un job fermato dal tetto di `timeout-minutes` non si
    # conclude "failure" e per quattro domeniche di fila nessuno ha ricevuto
    # niente mentre il backup moriva.
    if: failure() || cancelled()
    permissions:
      issues: write
    steps:
      - name: Crea issue di notifica
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Backup Media fallito — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Backup Media Fallito',
              '',
              `**Data:** ${new Date().toISOString()}`,
              `**Workflow:** ${context.workflow}`,
              `**Run ID:** ${context.runId}`,
              '',
              `🔗 [Vedi logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Azione richiesta',
              'Verificare i logs e risolvere il problema.',
              'Eseguire un backup manuale dopo la correzione.'
            ].join('\n');

            for (const label of ['backup', 'urgente']) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'urgente' ? 'D93F0B' : '0E8A16'
                });
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['backup', 'urgente']
            });
