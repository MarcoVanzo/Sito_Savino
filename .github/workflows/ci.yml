# Pipeline CI/CD per Sito Savino
# Esegue controlli di qualità su push a main e pull request
# Deploya su DigitalOcean App Platform solo se i test passano (push a main)
#
# Economia minuti Actions: i push su main girano in modalità "veloce"
# (niente coverage né SonarCloud, ~2 min in meno a run); l'analisi completa
# gira sulle PR, sulla run schedulata del lunedì (baseline SonarCloud di main)
# e su lancio manuale. Il deploy resta gated e parte solo sui push a main.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Loghi/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'  # lunedì 05:00 UTC — run completa per la baseline SonarCloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    # Esposto a livello di job: così il campo `if:` dello step SonarCloud
    # (valutato prima dell'env di step) vede davvero il token. Se il secret
    # non è impostato resta vuoto e lo scan viene saltato.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # MySQL 8.4 LTS — allineato a produzione DigitalOcean
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sito_savino_test
          MYSQL_USER: sito_savino
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Checkout del codice sorgente (history completa solo quando serve a Sonar)
      - name: Checkout codice
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name != 'push' && 0 || 1 }}

      # Configurazione PHP 8.4 — Xdebug (lento) solo nelle run con coverage
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, curl, pdo, pdo_mysql
          coverage: ${{ github.event_name != 'push' && 'xdebug' || 'none' }}

      # Configurazione Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # Cache dipendenze Composer
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Installazione dipendenze PHP
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # Installazione dipendenze Node.js
      # --ignore-scripts: blocca i lifecycle script dei pacchetti in fase di
      # install (hardening supply-chain, SonarCloud S6505). Le dipendenze sono
      # pure JS (vite/vue/tailwind), nessuna richiede build nativa post-install.
      - name: NPM install
        run: npm ci --ignore-scripts

      # Build degli asset frontend (Vite)
      - name: NPM build
        run: npm run build

      # Lint JS/Vue. Blocca solo sugli errori: i warning residui sono quasi
      # tutti d'ordine degli attributi nei template, li si assorbe man mano
      # senza un diff di riformattazione che renderebbe illeggibile ogni PR.
      - name: Lint JS/Vue (ESLint)
        run: npm run lint

      # Test frontend. Coprono i composable con logica vera — normalizzazione
      # degli URL dal CMS e sanificazione dell'HTML — cioè le due cose fra il
      # contenuto redazionale e il DOM del visitatore.
      - name: Esegui test frontend (Vitest)
        run: npm test

      # Security audit — verifica vulnerabilità note nelle dipendenze
      - name: Security Audit (Composer)
        run: composer audit --abandoned=report

      # Lint PHP — verifica errori di sintassi in app/
      - name: PHP Lint
        run: find app/ -name "*.php" -print0 | xargs -0 -n1 php -l

      # Code style — verifica conformità con Laravel Pint
      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Static Analysis — PHPStan/Larastan livello 5
      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Preparazione ambiente per i test
      - name: Prepara .env per test
        run: |
          cp .env.testing .env
          php artisan key:generate

      # Test PHPUnit con MySQL 8.4 (coverage solo nelle run complete)
      - name: Esegui test PHPUnit
        run: php artisan test ${{ github.event_name != 'push' && '--coverage-clover=coverage.xml' || '' }}

      # SonarCloud — analisi qualità/sicurezza + upload coverage.
      # Solo run complete (PR, schedule, manuale): sui push a main è la parte
      # più costosa della pipeline e non cambia l'esito del deploy.
      # Saltato automaticamente finché il secret SONAR_TOKEN non è impostato
      # (env.SONAR_TOKEN ereditato dal job, vedi sopra).
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != '' && github.event_name != 'push'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.projectKey=MarcoVanzo_Sito_Savino
            -Dsonar.organization=marcovanzo
            -Dsonar.php.coverage.reportPaths=coverage.xml

  # Deploy gated: esegue SOLO su push a main, DOPO che i test passano
  deploy:
    name: Deploy to DigitalOcean
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Checkout codice
        uses: actions/checkout@v6

      - name: Deploy su App Platform
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
