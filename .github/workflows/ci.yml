# Pipeline CI/CD per Sito Savino
# Esegue controlli di qualità su push a main e pull request
# Deploya su DigitalOcean App Platform solo se i test passano (push a main)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    # MySQL 8.4 LTS — allineato a produzione DigitalOcean
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: sito_savino_test
          MYSQL_USER: sito_savino
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Checkout del codice sorgente
      - name: Checkout codice
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for SonarCloud

      # Configurazione PHP 8.4 con Xdebug per coverage
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, curl, pdo, pdo_mysql
          coverage: xdebug

      # Configurazione Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # Cache dipendenze Composer
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Installazione dipendenze PHP
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # Installazione dipendenze Node.js
      - name: NPM install
        run: npm ci

      # Build degli asset frontend (Vite)
      - name: NPM build
        run: npm run build

      # Security audit — verifica vulnerabilità note nelle dipendenze
      - name: Security Audit (Composer)
        run: composer audit --abandoned=report

      # Lint PHP — verifica errori di sintassi in app/
      - name: PHP Lint
        run: find app/ -name "*.php" -print0 | xargs -0 -n1 php -l

      # Code style — verifica conformità con Laravel Pint
      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Static Analysis — PHPStan/Larastan livello 5
      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Preparazione ambiente per i test
      - name: Prepara .env per test
        run: |
          cp .env.testing .env
          php artisan key:generate

      # Test PHPUnit con MySQL 8.4 + code coverage
      - name: Esegui test PHPUnit
        run: php artisan test --coverage-clover=coverage.xml

      # Upload coverage per SonarCloud (opzionale)
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MarcoVanzo_Sito_Savino
            -Dsonar.organization=marcovanzo
            -Dsonar.php.coverage.reportPaths=coverage.xml

  # Deploy gated: esegue SOLO su push a main, DOPO che i test passano
  deploy:
    name: Deploy to DigitalOcean
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Checkout codice
        uses: actions/checkout@v6

      - name: Deploy su App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
