; =============================================
; OPcache & PHP-FPM production optimizations
; Savino Del Bene Volley
; =============================================
; Loaded via: heroku-php-apache2 -i php-config/opcache.ini public/

; --- OPcache Memory ---
; Produzione usa ~85MB di OPcache memory e ~1600 file cachati.
; 128MB e 10000 file sono più che sufficienti con ampio margine.
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.interned_strings_buffer=16

; --- OPcache Validation ---
; In produzione i file non cambiano: il deploy ricrea il container.
; Disabilitare il timestamp check elimina stat() su ogni file incluso.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.enable_file_override=1

; --- JIT (PHP 8.1+) ---
; Modalità tracing (1255): compila in codice macchina nativo
; le hot path più frequenti. Buffer 32MB basta (prod usa <1MB).
opcache.jit=1255
opcache.jit_buffer_size=32M
