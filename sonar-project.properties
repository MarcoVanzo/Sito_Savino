# =============================================================================
# SonarCloud Configuration — Sito Savino
# =============================================================================

sonar.projectKey=MarcoVanzo_Sito_Savino
sonar.organization=marcovanzo

# Encoding dei sorgenti (evita il warning "problems with file encoding":
# senza questa riga Sonar usa l'encoding di sistema del runner CI, non UTF-8)
sonar.sourceEncoding=UTF-8

# Sorgenti da analizzare
sonar.sources=app,resources,routes,config,database,.github
sonar.tests=tests

# Esclusioni generali (vendor, build artifacts, storage)
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  public/build/**,\
  storage/**,\
  bootstrap/cache/**,\
  *.lock

# ─── Esclusioni per falsi positivi ──────────────────────────────────────────

# Web:PageWithoutTitleCheck — Falso positivo per app Inertia.js/Vue
# Le pagine Vue usano <Head :title="..." /> di @inertiajs/vue3 per gestire
# il <title>. SonarCloud non comprende questo pattern SPA.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Ignora "Add a <title> tag" sui file Vue (Inertia gestisce i titoli)
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.vue

# Ignora "weak hash algorithm" nei test (Laravel MustVerifyEmail richiede sha1)
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.php

# md5 come chiave di deduplicazione (non sicurezza): mantenuto per compatibilità
# con i file_hash già salvati in DB dal comando di import gallery.
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e3.resourceKey=app/Console/Commands/CreateGalleryFromPosts.php

# Math.random() usato solo per l'animazione decorativa delle particelle in home
# (nessun contesto di sicurezza): S2245 falso positivo.
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e4.resourceKey=resources/js/Pages/Public/Home.vue
