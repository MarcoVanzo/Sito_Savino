# =============================================================================
# SonarCloud Configuration — Sito Savino
# =============================================================================

sonar.projectKey=MarcoVanzo_Sito_Savino
sonar.organization=marcovanzo

# Encoding dei sorgenti (evita il warning "problems with file encoding":
# senza questa riga Sonar usa l'encoding di sistema del runner CI, non UTF-8)
sonar.sourceEncoding=UTF-8

# Sorgenti da analizzare
sonar.sources=app,resources,routes,config,database,.github
sonar.tests=tests

# NOTA: i test JS stanno accanto al codice che provano
# (resources/js/**/*.test.js), non in `tests/`. Sono esclusi dai sorgenti qui
# sotto: senza, Sonar li contava come codice di produzione da coprire, e i file
# di test risultavano la principale voce di "codice non coperto" della PR che
# li introduceva.

# Esclusioni generali (vendor, build artifacts, storage)
sonar.exclusions=\
  resources/js/**/*.test.js,\
  vendor/**,\
  node_modules/**,\
  public/build/**,\
  storage/**,\
  bootstrap/cache/**,\
  *.lock

# ─── Esclusioni per falsi positivi ──────────────────────────────────────────

# Web:PageWithoutTitleCheck — Falso positivo per app Inertia.js/Vue
# Le pagine Vue usano <Head :title="..." /> di @inertiajs/vue3 per gestire
# il <title>. SonarCloud non comprende questo pattern SPA.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17

# Ignora "Add a <title> tag" sui file Vue (Inertia gestisce i titoli)
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.vue

# Ignora "weak hash algorithm" nei test (Laravel MustVerifyEmail richiede sha1)
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.php

# md5 come chiave di deduplicazione (non sicurezza): mantenuto per compatibilità
# con i file_hash già salvati in DB dal comando di import gallery.
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e3.resourceKey=app/Console/Commands/CreateGalleryFromPosts.php

# Math.random() usato solo per l'animazione decorativa delle particelle in home
# (nessun contesto di sicurezza): S2245 falso positivo.
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e4.resourceKey=resources/js/Pages/Public/Home.vue

# ─── Falsi positivi su firme imposte dal framework Laravel ──────────────────

# S1172 "parametro non usato" sui metodi Policy: la firma (User $user, Model
# $model) è parte del contratto Laravel e va mantenuta anche quando il permesso
# è basato solo sul ruolo e il model non viene letto.
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e5.resourceKey=app/Policies/**/*.php

# S1172 sui metodi Observer: ricevono sempre il model come argomento anche se
# uno specifico hook non lo usa (firma imposta da Eloquent).
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e6.resourceKey=app/Observers/**/*.php

# ─── Falsi positivi sui template email (HTML per client di posta) ───────────

# S5257 "tabella di layout": le email richiedono layout a tabelle per
# compatibilità con i client (Outlook ecc.); usano già role="presentation".
sonar.issue.ignore.multicriteria.e7.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.e7.resourceKey=resources/views/emails/**/*.blade.php

# S1827 attributi presentazionali deprecati (frameborder/cellpadding ecc.):
# necessari nelle email per la resa sui client di posta datati.
sonar.issue.ignore.multicriteria.e8.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.e8.resourceKey=resources/views/emails/**/*.blade.php

# ─── Falsi positivi di accessibilità (limiti dell'analizzatore su Vue) ──────

# S6840 "autocomplete corretto": il valore autocomplete="name" È corretto, ma
# Sonar non risolve il tipo dell'input reso dal componente custom <TextInput>.
sonar.issue.ignore.multicriteria.e9.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.e9.resourceKey=resources/js/Pages/Auth/Register.vue
sonar.issue.ignore.multicriteria.e10.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.e10.resourceKey=resources/js/Pages/Profile/Partials/UpdateProfileInformationForm.vue

# S6847 "listener su elemento non interattivo": è un attributo onerror di
# fallback immagine, non un handler mouse/tastiera. Falso positivo.
sonar.issue.ignore.multicriteria.e11.ruleKey=Web:S6847
sonar.issue.ignore.multicriteria.e11.resourceKey=resources/js/Pages/Public/Societa/Palazzetto.vue

# S6825 "aria-hidden su elemento focalizzabile": è il <canvas> decorativo delle
# particelle (pointer-events-none, nessun tabindex): non è focalizzabile.
sonar.issue.ignore.multicriteria.e12.ruleKey=Web:S6825
sonar.issue.ignore.multicriteria.e12.resourceKey=resources/js/Pages/Public/Home.vue

# S6851 "parola ridondante nell'alt": l'alt è il bind dinamico :alt="photo.name";
# Sonar legge il token "photo" dall'espressione, non dal testo reale.
sonar.issue.ignore.multicriteria.e13.ruleKey=Web:S6851
sonar.issue.ignore.multicriteria.e13.resourceKey=resources/views/filament/actions/sync-face-progress.blade.php

# S5332 "usa https invece di http" nei test JS: useSafeUrl DEVE accettare gli
# URL http — è il comportamento sotto test — quindi il letterale http:// nelle
# asserzioni è necessario, non una svista. Escluso solo nei file di test.
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e14.resourceKey=resources/js/**/*.test.js

# S4790 su tre hash che non proteggono niente: sono chiavi, non firme.
# md5 dell'indirizzo di origine come impronta per riconoscere una foto gia'
# importata senza riscaricarla; md5 del titolo e sha1 dell'indirizzo del
# service account come chiavi di cache. In tutti e tre i casi un'eventuale
# collisione varrebbe un doppione o un dato in cache, non un accesso.
sonar.issue.ignore.multicriteria.e15.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e15.resourceKey=app/Console/Commands/ImportaLaGalleryDalVecchioSito.php
sonar.issue.ignore.multicriteria.e16.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e16.resourceKey=app/Filament/Actions/ImportPalmaresAction.php
sonar.issue.ignore.multicriteria.e17.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e17.resourceKey=app/Services/Analytics/Ga4Credentials.php

# ─── Copertura ──────────────────────────────────────────────────────────────

# Copertura JS da Vitest. Senza questa riga `sonar.sources` includeva
# `resources` ma nessun report ne descriveva la copertura, quindi ogni riga di
# JS contava come non coperta nel quality gate.
sonar.javascript.lcov.reportPaths=coverage-js/lcov.info
